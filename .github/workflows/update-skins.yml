name: Update GitSkins Assets

on:
  schedule:
    # Berjalan otomatis setiap hari pukul 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Memungkinkan trigger manual via tab Actions

permissions:
  contents: write

jobs:
  update-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create assets folder
        run: mkdir -p assets

      - name: Fetch Dynamic SVGs from GitSkins
        run: |
          # 1. Fetch stack.svg dengan fallback aman
          curl -sSf --retry 3 --max-time 30 -H "User-Agent: Mozilla/5.0" "https://www.gitskins.com/api/section/stack?username=Lesmana24&theme=navi" -o assets/stack.tmp.svg || true
          if [ -s assets/stack.tmp.svg ] && grep -q "<svg" assets/stack.tmp.svg; then
            mv assets/stack.tmp.svg assets/stack.svg
          else
            echo "Warning: Gagal mengunduh stack.svg yang valid. Mempertahankan file lama."
            rm -f assets/stack.tmp.svg
          fi

          # 2. Fetch projects.svg dengan fallback aman
          curl -sSf --retry 3 --max-time 45 -H "User-Agent: Mozilla/5.0" "https://www.gitskins.com/api/section/projects?username=Lesmana24&theme=navi" -o assets/projects.tmp.svg || true
          if [ -s assets/projects.tmp.svg ] && grep -q "<svg" assets/projects.tmp.svg; then
            mv assets/projects.tmp.svg assets/projects.svg
          else
            echo "Warning: Gagal mengunduh projects.svg yang valid. Mempertahankan file lama."
            rm -f assets/projects.tmp.svg
          fi

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update dynamic gitskins cards" && git push)
